<div class="p-4 max-w-md mx-auto">

  <!-- Main Tabs (Roti / Gravy) -->
  <div class="flex mb-6 rounded-lg overflow-hidden shadow-sm">
    <button (click)="selectTab('Roti')" [ngClass]="{
        'bg-blue-500 text-white': selectedTab === 'Roti',
        'bg-white text-blue-500 hover:bg-blue-100': selectedTab !== 'Roti'
      }" class="flex-1 py-3 font-semibold text-center transition-colors duration-200">
      Roti
    </button>
    <button (click)="selectTab('Gravy')" [ngClass]="{
        'bg-blue-500 text-white': selectedTab === 'Gravy',
        'bg-white text-blue-500 hover:bg-blue-100': selectedTab !== 'Gravy'
      }" class="flex-1 py-3 font-semibold text-center transition-colors duration-200">
      Gravy
    </button>
  </div>

  <!-- Roti Tab Content -->
  <div *ngIf="selectedTab === 'Roti'">
    <div class="p-6 bg-white shadow-lg rounded-xl mb-6">
      <h2 class="text-2xl font-bold mb-4 text-gray-800">Roti Items</h2>
      <div class="border-b border-gray-200 mb-4"></div>
      <ul class="space-y-3">
        <li *ngFor="let roti of rotis"
          class="flex justify-between items-center p-4 rounded-lg border border-gray-100 shadow-sm hover:shadow-md transition-shadow duration-200">
          <span class="text-lg font-medium text-gray-700">{{ roti.name }}</span>
          <span class="text-lg font-semibold text-gray-900">Rs {{ roti.price }}</span>
        </li>
      </ul>
    </div>
  </div>

  <!-- Gravy Tab Content -->
  <div *ngIf="selectedTab === 'Gravy'">
    <!-- Sub Tabs (All, Veg, Non-Veg) -->
    <div class="flex space-x-4 mb-6">
      <button class="flex-1 py-2 rounded-lg font-semibold text-center transition-colors duration-200" [ngClass]="{
          'bg-blue-500 text-white': selectedGravyTab === 'All',
          'bg-white text-blue-500 hover:bg-blue-100': selectedGravyTab !== 'All'
        }" (click)="selectGravyTab('All')">
        All
      </button>
      <button class="flex-1 py-2 rounded-lg font-semibold text-center transition-colors duration-200" [ngClass]="{
          'bg-green-500 text-white': selectedGravyTab === 'Veg',
          'bg-white text-green-500 hover:bg-green-100': selectedGravyTab !== 'Veg'
        }" (click)="selectGravyTab('Veg')">
        Veg
      </button>
      <button class="flex-1 py-2 rounded-lg font-semibold text-center transition-colors duration-200" [ngClass]="{
          'bg-red-500 text-white': selectedGravyTab === 'Non-Veg',
          'bg-white text-red-500 hover:bg-red-100': selectedGravyTab !== 'Non-Veg'
        }" (click)="selectGravyTab('Non-Veg')">
        Non-Veg
      </button>
    </div>

    <!-- Gravy Items -->
    <div class="p-6 bg-white shadow-lg rounded-xl mb-6">
      <h2 class="text-2xl font-bold mb-4 text-gray-800">Gravy Items</h2>
      <div class="border-b border-gray-200 mb-4"></div>
      <ul class="space-y-3">
        <li *ngFor="let gravy of filteredGravyItems()"
          class="flex justify-between items-center p-4 rounded-lg border border-gray-100 shadow-sm hover:shadow-md transition-shadow duration-200 relative">
          <!-- Veg/Non-Veg Indicator -->
          <div class="absolute left-0 w-3 h-3 rounded-full mt-1" [ngClass]="{
              'bg-green-500': gravy.type === 'Veg',
              'bg-red-500': gravy.type === 'Non-Veg'
            }"></div>

          <span class="ml-8 text-lg font-medium text-gray-700">{{ gravy.name }}</span>
          <span class="text-lg font-semibold text-gray-900">Rs {{ gravy.price }}</span>
        </li>
      </ul>
    </div>
  </div>
</div>
