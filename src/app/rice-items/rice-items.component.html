<div class="p-4 max-w-md mx-auto">

  <!-- Section Title -->
  <h2 class="text-2xl font-bold mb-4 text-gray-800 flex items-center">Rice Items</h2>
  <div class="border-b border-gray-200 mb-4"></div>

  <!-- Tabs for filtering (All, Veg, Non-Veg) -->
  <div class="flex space-x-4 mb-6">
    <button class="flex-1 py-2 rounded-lg font-semibold text-center transition-colors duration-200" [ngClass]="{
        'bg-blue-500 text-white': selectedTab === 'All',
        'bg-white text-blue-500 hover:bg-blue-100': selectedTab !== 'All'
      }" (click)="selectTab('All')">
      All
    </button>
    <button class="flex-1 py-2 rounded-lg font-semibold text-center transition-colors duration-200" [ngClass]="{
        'bg-green-500 text-white': selectedTab === 'Veg',
        'bg-white text-green-500 hover:bg-green-100': selectedTab !== 'Veg'
      }" (click)="selectTab('Veg')">
      Veg
    </button>
    <button class="flex-1 py-2 rounded-lg font-semibold text-center transition-colors duration-200" [ngClass]="{
        'bg-red-500 text-white': selectedTab === 'Non-Veg',
        'bg-white text-red-500 hover:bg-red-100': selectedTab !== 'Non-Veg'
      }" (click)="selectTab('Non-Veg')">
      Non-Veg
    </button>
  </div>

  <!-- Rice Items Card -->
  <div class="p-6 bg-white shadow-lg rounded-xl">
    <ul class="space-y-3">
      <li *ngFor="let rice of filteredRices"
        class="flex justify-between items-center p-4 rounded-lg border border-gray-100 shadow-sm hover:shadow-md transition-shadow duration-200 relative">
        <!-- Veg/Non-Veg Indicator -->
        <div class="absolute left-0 w-3 h-3 rounded-full mt-1" [ngClass]="{
            'bg-green-500': rice.type === 'Veg',
            'bg-red-500': rice.type === 'Non-Veg'
          }"></div>

        <span class="ml-8 text-lg font-medium text-gray-700">{{ rice.name }}</span>
        <span class="text-lg font-semibold text-gray-900">Rs {{ rice.price }}</span>
      </li>
    </ul>
  </div>

</div>
