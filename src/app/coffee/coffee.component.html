<div class="max-w-7xl mx-auto px-4 py-8">
  <!-- Header Section -->
  <header class="text-center mb-12">
    <h1 class="heading-font text-4xl md:text-5xl font-bold text-gray-800 mb-2 flex items-center justify-center">
      <i class="fas fa-mug-hot mr-3 text-amber-600"></i>Hot Beverages
    </h1>
    <div class="section-divider w-32 mx-auto my-4"></div>
    <p class="text-lg text-gray-600 max-w-2xl mx-auto">
      Warm up with our aromatic and flavorful selection of hot beverages, perfect for any time of the day. Indulge in
      classics like Cappuccino, Coffee Latte, and more!
    </p>
  </header>

  <!-- Beverage Cards Grid -->
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
    <div *ngFor="let coffee of coffees" class="bg-white rounded-2xl overflow-hidden shadow-lg card-hover relative p-6">

      <!-- Type Indicator -->
      <div class="absolute top-4 left-4 veg-indicator" [ngClass]="{
        'bg-green-600': coffee.type === 'Veg',
        'bg-red-600': coffee.type === 'Non-Veg'
      }">
        <i class="fas" [ngClass]="{
          'fa-leaf': coffee.type === 'Veg',
          'fa-drumstick-bite': coffee.type === 'Non-Veg'
        }"></i>
      </div>

      <!-- Price Tag -->
      <div class="absolute top-4 right-4 price-tag" [ngClass]="{
        'price-amber': coffee.type === 'All',
        'price-green': coffee.type === 'Veg',
        'price-red': coffee.type === 'Non-Veg'
      }">
        Rs {{ coffee.price }}
      </div>

      <!-- Content -->
      <h2 class="text-xl font-bold text-gray-800 mb-2 truncate">{{ coffee.name }}</h2>
      <p class="text-gray-600 mb-4 line-clamp-2">{{ coffee.description }}</p>
    </div>
  </div>

  <!-- Empty State -->
  <!-- Spinner -->
  <div *ngIf="loadingCoffee" class="flex justify-center py-12">
    <div class="w-10 h-10 border-4 border-gray-300 border-t-amber-600 rounded-full animate-spin"></div>
  </div>

</div>
