<!-- Pizza Cards -->
<div class="mt-6 grid grid-cols-1 gap-4 sm:grid-cols-1 md:grid-cols-4 lg:grid-cols-4">
    <div
      *ngFor="let pizza of filteredPizzas"
      class="p-4 border border-gray-300 rounded-lg shadow-md relative"
    >
      <img
        [src]="pizza.imageUrl"
        class="w-full h-40 object-cover object-top rounded-lg"
      />
      <!-- Dot indicator -->
      <div
        class="ml-1.5"
        [ngClass]="{
          'absolute top-2 left-2 w-3 h-3 rounded-full': true,
          'bg-green-500': pizza.type === 'Veg',
          'bg-red-500': pizza.type === 'Non-Veg'
        }"
      ></div>
  
      <h2 class="mt-2 text-lg font-bold text-slate-700 flex-grow">
        {{ pizza.name }}
      </h2>
      <p class="mt-2 flex-grow text-sm text-gray-600">
        {{ pizza.description }}
      </p>
      <div class="mt-2 flex flex-col space-y-2">
        <div class="flex justify-between">
          <span class="font-bold">Regular</span>
          <span class="font-bold">Rs {{ pizza.regularPrice }}</span>
        </div>
      </div>
  
      <!-- Add to Cart / Remove from Cart Button -->
      <button
        *ngIf="!pizza.isInCart"
        class="bg-blue-500 text-white px-4 py-2 mt-4 rounded hover:bg-blue-600 w-full"
        (click)="addToCart(pizza)"
      >
        Add to Cart
      </button>
  
      <button
        *ngIf="pizza.isInCart"
        class="bg-green-500 text-white px-4 py-2 mt-4 rounded hover:bg-green-600 w-full"
        (click)="removeFromCart(pizza)"
      >
        Remove from Cart
      </button>
    </div>
  </div>
