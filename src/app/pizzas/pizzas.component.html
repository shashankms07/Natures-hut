<div class="max-w-7xl mx-auto px-4 py-8">
  <!-- Header Section -->
  <header class="text-center mb-12">
    <h1 class="heading-font text-4xl md:text-5xl font-bold text-gray-800 mb-2 flex items-center justify-center">
      <i class="fas fa-pizza-slice mr-3 text-amber-600"></i>Pizzas
    </h1>
    <div class="section-divider w-32 mx-auto my-4"></div>
    <p class="text-lg text-gray-600 max-w-2xl mx-auto">
      Cheesilicious pizzas to make every day extraordinary.
    </p>
  </header>

  <!-- Filter Tabs -->
  <div class="flex justify-center mb-10">
    <div class="inline-flex rounded-lg border border-gray-200 bg-white p-1 shadow-sm">
      <button class="filter-btn px-6 py-3 rounded-md font-medium transition-all duration-300" [ngClass]="{
          'active active-all': selectedTab === 'All'
        }" (click)="selectTab('All')">
        <i class="fas fa-utensils mr-2"></i>All
      </button>

      <button class="filter-btn px-6 py-3 rounded-md font-medium transition-all duration-300" [ngClass]="{
          'active active-veg': selectedTab === 'Veg'
        }" (click)="selectTab('Veg')">
        <i class="fas fa-leaf mr-2"></i>Veg
      </button>

      <button class="filter-btn px-6 py-3 rounded-md font-medium transition-all duration-300" [ngClass]="{
          'active active-nonveg': selectedTab === 'Non-Veg'
        }" (click)="selectTab('Non-Veg')">
        <i class="fas fa-drumstick-bite mr-2"></i>Non-Veg
      </button>
    </div>
  </div>

  <!-- Pizza Cards Grid -->
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
    <div *ngFor="let pizza of filteredPizzas"
      class="starter-card bg-white rounded-2xl overflow-hidden shadow-lg card-hover relative">
      <!-- Image Container -->
      <div class="relative overflow-hidden">
        <img [src]="pizza.imageUrl" alt="{{ pizza.name }}" class="w-full h-56 object-cover starter-image" />

        <!-- Type Indicator -->
        <div class="absolute top-4 left-4 veg-indicator" [ngClass]="{
          'bg-green-600': pizza.type === 'Veg',
          'bg-red-600': pizza.type === 'Non-Veg'
        }">
          <i class="fas" [ngClass]="{
            'fa-leaf': pizza.type === 'Veg',
            'fa-drumstick-bite': pizza.type === 'Non-Veg'
          }"></i>
        </div>


      </div>

      <!-- Content -->

      <!-- Content -->
      <div class="p-6">
        <h2 class="text-xl font-bold text-gray-800 mb-2 truncate">{{ pizza.name }}</h2>
        <p class="text-gray-600 mb-4 line-clamp-2">{{ pizza.description }}</p>

        <!-- Regular & Medium Prices Left-Label Right-Price -->
        <div class="flex flex-col space-y-1">
          <div class="flex justify-between text-gray-800 font-semibold">
            <span>Regular</span>
            <span class="price-tag text-sm" [ngClass]="{
            'price-amber': pizza.type === 'All',
            'price-green': pizza.type === 'Veg',
            'price-red': pizza.type === 'Non-Veg'
          }">Rs {{ pizza.regularPrice }}</span>
          </div>
          <div class=" flex justify-between text-gray-800 font-semibold">
            <span>Medium</span>
            <span class="price-tag text-sm" [ngClass]="{
            'price-amber': pizza.type === 'All',
            'price-green': pizza.type === 'Veg',
            'price-red': pizza.type === 'Non-Veg'
          }">Rs {{ pizza.mediumPrice }}</span>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Spinner -->
  <div *ngIf="loadingPizzas" class="flex justify-center py-12">
    <div class="w-10 h-10 border-4 border-gray-300 border-t-amber-600 rounded-full animate-spin"></div>
  </div>

  <!-- Empty State -->
  <div *ngIf="!loadingPizzas && filteredPizzas.length === 0" class="text-center py-12">
    <i class="fas fa-pizza-slice text-4xl text-gray-300 mb-4"></i>
    <h3 class="text-xl font-medium text-gray-500">No pizzas found</h3>
    <p class="text-gray-400">Try selecting a different filter</p>
  </div>



</div>
