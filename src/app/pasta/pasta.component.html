<div class="max-w-7xl mx-auto px-4 py-8">
  <!-- Header Section -->
  <header class="text-center mb-12">
    <h1 class="heading-font text-4xl md:text-5xl font-bold text-gray-800 mb-2 flex items-center justify-center">
      <i class="fas fa-utensils mr-3 text-amber-600"></i> Pastas

    </h1>
    <div class="section-divider w-32 mx-auto my-4"></div>
    <p class="text-lg text-gray-600 max-w-2xl mx-auto">
      Savor our flavorful pastas, from creamy Alfredo to classic Arrabbiata. A
      perfect treat for pasta lovers!
    </p>
  </header>

  <!-- Filter Tabs -->
  <div class="flex justify-center mb-10">
    <div class="inline-flex rounded-lg border border-gray-200 bg-white p-1 shadow-sm">
      <button class="filter-btn px-6 py-3 rounded-md font-medium transition-all duration-300"
        [ngClass]="{ 'active active-all': selectedTab === 'All' }" (click)="selectTab('All')">
        <i class="fas fa-utensils mr-2"></i>All Pastas
      </button>

      <button class="filter-btn px-6 py-3 rounded-md font-medium transition-all duration-300"
        [ngClass]="{ 'active active-veg': selectedTab === 'Veg' }" (click)="selectTab('Veg')">
        <i class="fas fa-leaf mr-2"></i>Veg
      </button>

      <button class="filter-btn px-6 py-3 rounded-md font-medium transition-all duration-300"
        [ngClass]="{ 'active active-nonveg': selectedTab === 'Non-Veg' }" (click)="selectTab('Non-Veg')">
        <i class="fas fa-drumstick-bite mr-2"></i>Non-Veg
      </button>
    </div>
  </div>

  <!-- Pasta Cards Grid -->
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
    <!-- keep your logic: still uses starter -->
    <div *ngFor="let starter of filteredStarters"
      class="starter-card bg-white rounded-2xl overflow-hidden shadow-lg card-hover relative">
      <!-- Image Container -->
      <div class="relative overflow-hidden">
        <img [src]="starter.imageUrl" alt="{{ starter.name }}" class="w-full h-56 object-cover starter-image" />

        <!-- Type Indicator -->
        <div class="absolute top-4 left-4 veg-indicator" [ngClass]="{
            'bg-green-600': starter.type === 'Veg',
            'bg-red-600': starter.type === 'Non-Veg'
          }">
          <i class="fas" [ngClass]="{
              'fa-leaf': starter.type === 'Veg',
              'fa-drumstick-bite': starter.type === 'Non-Veg'
            }"></i>
        </div>

        <!-- Price Tag -->
        <div class="absolute top-4 right-4 price-tag" [ngClass]="{
            'price-amber': starter.type === 'All',
            'price-green': starter.type === 'Veg',
            'price-red': starter.type === 'Non-Veg'
          }">
          Rs {{ starter.price }}
        </div>

        <!-- Hover Overlay -->
        <div
          class="absolute inset-0 bg-black bg-opacity-0 hover:bg-opacity-20 transition-all duration-300 flex items-center justify-center">
          <button
            class="bg-white text-amber-700 px-4 py-2 rounded-full font-medium opacity-0 hover:opacity-100 transition-opacity duration-300 transform translate-y-4 hover:translate-y-0">
            Quick View <i class="ml-1 fas fa-eye"></i>
          </button>
        </div>
      </div>

      <!-- Content -->
      <div class="p-6">
        <h2 class="text-xl font-bold text-gray-800 mb-2 truncate">
          {{ starter.name }}
        </h2>
        <p class="text-gray-600 mb-4 line-clamp-2">{{ starter.description }}</p>
      </div>
    </div>
  </div>

  <!-- Empty State -->
  <div *ngIf="filteredStarters.length === 0" class="text-center py-12">
    <i class="fas fa-pizza-slice text-4xl text-gray-300 mb-4"></i>
    <h3 class="text-xl font-medium text-gray-500">No pastas found</h3>
    <p class="text-gray-400">Try selecting a different filter</p>
  </div>
</div>
