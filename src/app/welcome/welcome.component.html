<!-- welcome.component.html -->
<div class="min-h-screen flex flex-col items-center justify-center relative overflow-hidden bg-amber-50">
  <!-- Background Image -->
  <div class="absolute inset-0 bg-cover bg-center"
    style="background-image: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1950&q=80');">
  </div>
  <div class="absolute inset-0 bg-gradient-to-br from-amber-50/70 via-white/80 to-amber-100/60"></div>

  <!-- Floating Leaves -->
  <div class="absolute top-10 left-10 text-amber-300 text-6xl animate-bounce">🍃</div>
  <div class="absolute bottom-12 right-12 text-amber-400 text-5xl animate-bounce">🌿</div>


  <!-- Main Text -->
  <div class="text-center px-4 z-10 animate-fadeInUp" style="animation-delay: 0.5s;">
    <h1
      class="text-4xl sm:text-5xl md:text-6xl lg:text-7xl font-bold text-amber-900 mb-4 font-['Playfair_Display'] drop-shadow">
      Welcome to
    </h1>
    <div class="relative inline-block">
      <h2
        class="text-5xl sm:text-6xl md:text-7xl lg:text-8xl font-bold bg-gradient-to-r from-amber-700 via-amber-600 to-amber-800 bg-clip-text text-transparent font-['Playfair_Display'] mb-6">
        Nature's Hut Café
      </h2>
      <div class="absolute -bottom-2 left-0 w-full h-1 bg-gradient-to-r from-amber-500/60 to-amber-700/60 rounded-full">
      </div>
    </div>
    <p class="text-lg sm:text-xl text-amber-800/90 max-w-2xl mx-auto mt-6 font-light">
      Where nature’s serenity meets culinary excellence
    </p>
  </div>

  <!-- Countdown Timer -->
  <div class="mt-8 z-10 flex flex-col items-center">
    <div
      class="countdown-circle mb-2 flex items-center justify-center w-16 h-16 rounded-full border-4 border-amber-600 text-xl font-bold text-amber-900 shadow-lg">
      <span>{{ countdown }}</span>
    </div>
    <p class="text-amber-700 text-sm">Redirecting to home page...</p>
  </div>
</div>
